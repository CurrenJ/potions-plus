plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

sourceSets {
    testmod {
        // Same shared gametest source as neoforge/build.gradle points at - the loader-agnostic static
        // methods in common/src/testmod/java/grill24/potionsplus/gametest/*.java (Phase 12).
        java.srcDir project(':common').file('src/testmod/java')
    }
}

// Extending the resolvable *configurations* (not the sourceSet's compileClasspath/runtimeClasspath
// FileCollection properties directly, which is what neoforge/build.gradle's testmod sourceSet block
// does) - fabric-api's dependencies are pulled in via Loom's `modImplementation`, which resolves and
// remaps through its own configuration machinery; `compileClasspath += main.compileClasspath` picked
// up an empty/pre-remap snapshot of main's classpath here (confirmed: `net.fabricmc.fabric.api.
// gametest.v1.GameTest` - present on :fabric:compileClasspath per `./gradlew :fabric:dependencies
// --configuration compileClasspath` - was absent from testmodCompileClasspath with that approach).
// extendsFrom is resolved lazily at task-execution time and works whichever loader added the
// dependency.
configurations.testmodCompileClasspath.extendsFrom(configurations.compileClasspath)
configurations.testmodRuntimeClasspath.extendsFrom(configurations.runtimeClasspath)

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // compile against the JEI API but do not include it at runtime
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    // At runtime, use the full JEI jar for Fabric. This is a real Fabric mod (ships its own
    // fabric.mod.json + an intermediary-namespace access widener), so it must go through Loom's
    // mod-aware `modRuntimeOnly` (not plain `runtimeOnly`) so Loom remaps it - including its AW -
    // to this project's dev runtime namespace. Plain `runtimeOnly` skipped that remap and crashed
    // :fabric:runClient at Knot.init with "Namespace (intermediary) does not match current runtime
    // namespace (named)" (see docs/multi-loader-expansion.md Phase 11 progress log).
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // Testmod (Phase 12): access the compiled main classes, same as neoforge/build.gradle.
    testmodImplementation sourceSets.main.output
}

// The testmod's own fabric.mod.json needs no token expansion (hand-authored fixed values - it is
// never distributed, so it does not need to track the mod's real version). Explicitly disable
// duplicatesStrategy surprises should main's resources ever be pulled in here by accident.
tasks.named('processTestmodResources').configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    dependsOn ':common:processResources'
    inputs.property 'version', project.version
    // Phase 10: common now carries a copy of NeoForge's shared datagen output (commonDatagen), so
    // pulling common's resources in below duplicates files already produced by fabric's own
    // generated-resources srcDir. Fabric's own copy wins (declared first in Gradle's duplicate
    // resolution), matching the 26.1.2 tree.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from project(":common").sourceSets.main.resources

    filesMatching('fabric.mod.json') {
        expand([
            'version': project.version,
            'mod_id': rootProject.mod_id,
            'mod_name': rootProject.mod_name,
            'mod_description': rootProject.mod_description,
            'mod_authors': rootProject.mod_authors,
            'mod_license': rootProject.mod_license,
            'mod_icon': rootProject.mod_icon,
            'mod_fabric_minecraft_version': "~${rootProject.minecraft_version}"
        ])
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

loom {
    mixin {
        // Distinct from common's "potionsplus-common-refmap.json" (common/build.gradle) - sharing a
        // name let shadowJar clobber one with the other silently (see that file's comment).
        defaultRefmapName = "potionsplus-fabric-refmap.json"
    }

    runs {
        datagen {
            inherit client
            name = "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/generated/resources")}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"

            runDir "build/datagen"
        }
        // Phase 12: headless game test server. Unlike NeoForge, Fabric needs no loom.mods
        // association or FML annotation-scan workaround - testmod is its own separate mod (its own
        // fabric.mod.json, id potionsplus_testmod, declared above), discovered the same way Fabric
        // Loader discovers any dev-mode mod: by finding fabric.mod.json on the run's classpath. The
        // `fabric-gametest` entrypoint it declares points fabric-gametest-api-v1's own
        // TestAnnotationLocator (javap-confirmed against the resolved fabric-gametest-api-v1 jar,
        // already pulled in transitively by the `fabric-api` umbrella dependency above - no extra
        // dependency needed) at PotionsPlusFabricGameTests, whose @GameTest-annotated methods
        // delegate into the same common/src/testmod static methods NeoForge's wrapper uses.
        gametest {
            server()
            source sourceSets.testmod
            vmArg "-Dfabric-api.gametest"
            runDir "build/gametest"
        }
    }
}

file("build/datagen").mkdirs()
file("build/gametest").mkdirs()
