plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    dependsOn ':common:processResources'
    inputs.property 'version', project.version
    // Phase 10: common now carries a copy of NeoForge's shared datagen output (commonDatagen), so
    // pulling common's resources in below duplicates files already produced by fabric's own
    // generated-resources srcDir. Fabric's own copy wins (declared first in Gradle's duplicate
    // resolution), matching the 26.1.2 tree.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from project(":common").sourceSets.main.resources

    filesMatching('fabric.mod.json') {
        expand([
            'version': project.version,
            'mod_id': rootProject.mod_id,
            'mod_name': rootProject.mod_name,
            'mod_description': rootProject.mod_description,
            'mod_authors': rootProject.mod_authors,
            'mod_license': rootProject.mod_license,
            'mod_icon': rootProject.mod_icon,
            'mod_fabric_minecraft_version': "~${rootProject.minecraft_version}"
        ])
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

loom {
    mixin {
        // Distinct from common's "potionsplus-common-refmap.json" (common/build.gradle) - sharing a
        // name let shadowJar clobber one with the other silently (see that file's comment).
        defaultRefmapName = "potionsplus-fabric-refmap.json"
    }

    runs {
        datagen {
            inherit client
            name = "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/generated/resources")}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"

            runDir "build/datagen"
        }
        // NOTE: no `gametest` run yet. Phase 12 wires it up once common/src/testmod's
        // `core.neoforge.*` imports are resolved (Phase 4) — a testmod source set pointed at
        // common/src/testmod cannot compile in the fabric module today.
    }
}

file("build/datagen").mkdirs()
