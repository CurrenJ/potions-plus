plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

sourceSets {
    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
        // Platform-agnostic game test logic lives in common/ so all three loaders can share it.
        java.srcDir(project(':common').file('src/testmod/java'))
    }
}

repositories {
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    compileOnly "mezz.jei:jei-26.1.2-fabric-api:$rootProject.jei_version"
    localRuntime "mezz.jei:jei-26.1.2-fabric:$rootProject.jei_version"

    // Game tests need the compiled main classes, not just the compile classpath.
    testmodImplementation sourceSets.main.output
}

processResources {
    dependsOn ':common:processResources'
    inputs.property 'version', project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from project(":common").sourceSets.main.resources

    filesMatching('fabric.mod.json') {
        expand([
            'version': project.version,
            'mod_license': rootProject.mod_license,
            'mod_id': rootProject.mod_id,
            'mod_name': rootProject.mod_name,
            'mod_authors': rootProject.mod_authors,
            'mod_description': rootProject.mod_description,
            'mod_icon': rootProject.mod_icon,
            'mod_fabric_minecraft_version': "~${rootProject.minecraft_version}"
        ])
    }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

// shadowJar (the distributable mod jar bundling common) isn't wired into
// build/assemble by default, so `./gradlew build` would silently produce only
// the classes-only "raw" jar - anything installed from that (or from a stale
// standalone shadowJar run) would run outdated common/ code with no warning.
tasks.named('assemble') {
    dependsOn(tasks.named('shadowJar'))
}

sourceSets.main.resources.srcDir('src/generated/resources')

loom {
    runs {
        datagen {
            inherit client
            name = "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/generated/resources")}"
            vmArg "-Dfabric-api.datagen.modid=potionsplus"

            runDir "build/datagen"
        }

        // Headless game test server: runs every registered test, then exits with the number of
        // failed *required* tests. Run with ./gradlew :fabric:runGametest
        gametest {
            server()
            source sourceSets.testmod
            name "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('junit.xml').get().asFile}"
            runDir "build/gametest"
        }
    }
}

// Custom run dirs are not created automatically before the run task executes, unlike the default
// "run" dir, so a fresh checkout would fail its first runDatagen/runGametest with "working directory does not exist".
file("build/datagen").mkdirs()
file("build/gametest").mkdirs()
