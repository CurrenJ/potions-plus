plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    // All three, per the canonical architectury layout (apt-ores@1.21.1, fishtastic). common's
    // classes MUST be on runtimeClasspath - `loom.mods` contributes nothing to the run classpath,
    // and NeoForge's userdev locator only treats a classpath entry as part of the `potionsplus`
    // mod if it carries META-INF/neoforge.mods.toml, which common's output dir does not. Phase 1
    // dropped these two to silence a JPMS split-package ResolutionException; the real cause of
    // that is the 14 packages common and neoforge both occupy (see docs/multi-loader-expansion.md
    // Phase 1). Fix the packages, not the classpath.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

sourceSets {
    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
        // Phase 1 moved the gametests to common/src/testmod; point at them there so
        // :neoforge:runGametest isn't silently NO-SOURCE. (Same shape as fishtastic.)
        java.srcDir project(':common').file('src/testmod/java')
    }
}

// Phase 12 fix (see loom { mods {} } comment below for the full evidence): compile testmod's
// classes straight into main's own output directory instead of testmod's separate split dir, so
// FML's dev-mode annotation scan (which only scans the sourceSet(s) actually associated with the
// mod - here just `main`) sees the @GameTestHolder-annotated test classes. Two tasks now write to
// the same directory, hence the explicit dependsOn so `processResources`, which also targets it,
// always runs first and neither task's Gradle up-to-date tracking gets confused about who owns it.
tasks.named('compileTestmodJava').configure {
    destinationDirectory.set(sourceSets.main.output.classesDirs.singleFile)
    dependsOn(tasks.named('processResources'))
}

// The merged testmod classes must never reach the distributable jar - shadowJar/remapJar package
// whatever main's classesDirs contain, and the redirect above just put testmod's .class files there.
// Both jar and shadowJar now read main's classesDirs after compileTestmodJava writes to it too, so
// Gradle's task-output-without-a-declared-dependency validation needs an explicit dependsOn here
// (both tasks already implicitly depend on compileJava for the same directory; this adds the same
// relationship for compileTestmodJava).
tasks.named('jar').configure {
    dependsOn(tasks.named('compileTestmodJava'))
    exclude '**/gametest/**'
}


repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // compile against the JEI API but do not include it at runtime
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // at runtime, use the full JEI jar for NeoForge
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Testmod: access the compiled main classes.
    testmodImplementation sourceSets.main.output

    // Unit tests. NOTE: architectury-loom has no equivalent of moddev's `unitTest { enable() }`.
    // `AlchemyTestBase`'s `Bootstrap.bootStrap()` is expected to go red here and stay red until
    // Phase 12 restores a working `common/src/test` setup - see docs/multi-loader-expansion.md
    // Phase 0's "known casualty" note. Do not delete the tests to make the build green.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    // Phase 10: common now carries a copy of neoforge's own shared datagen output
    // (commonDatagen), so pulling common's resources in below duplicates files already produced
    // by neoforge's own generated-resources srcDir. Neoforge's own copy wins (declared first in
    // Gradle's duplicate resolution), matching the 26.1.2 tree.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from project(":common").sourceSets.main.resources

    filesMatching('META-INF/neoforge.mods.toml') {
        expand([
            'version': project.version,
            'mod_version': rootProject.mod_version,
            'mod_license': rootProject.mod_license,
            'mod_id': rootProject.mod_id,
            'mod_name': rootProject.mod_name,
            'mod_authors': rootProject.mod_authors,
            'mod_description': rootProject.mod_description,
            'mod_icon': rootProject.mod_icon,
            'neoforge_version': rootProject.neoforge_version,
            'neo_version_range': rootProject.neo_version_range,
            'neoforge_loader_version_range': rootProject.neoforge_loader_version_range,
            'minecraft_version_range': rootProject.minecraft_version_range
        ])
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

shadowJar {
    dependsOn(tasks.named('compileTestmodJava'))
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    // shadowJar (not `jar`) is what remapJar actually packages (see inputFile below) - the merged
    // testmod classes from the compileTestmodJava redirect above must not reach it either.
    exclude '**/gametest/**'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

loom {
    mixin {
        // Distinct from common's "potionsplus-common-refmap.json" (common/build.gradle) - sharing a
        // name let shadowJar clobber one with the other silently (see that file's comment).
        defaultRefmapName = "potionsplus-neoforge-refmap.json"
    }

    // Phase 12: do NOT associate testmod with mod_id here (docs/multi-loader-expansion.md Phase 12's
    // `loom.mods` gotcha - confirmed empirically this session: with testmod listed as a second
    // sourceSet, :neoforge:runGametest boots clean and logs "Enabled Gametest Namespaces:
    // [potionsplus]", but FML's `ModList.getAllScanData()` annotation scan (GameTestHooks.
    // registerGametests(), decompiled via javap) never finds the `@GameTestHolder`-annotated test
    // classes - `GameTestServer.create` fails immediately with "No test functions were given!".
    // loom's mods{} sourceSet association puts testmod's split output dir on the runtime/mod
    // classpath (classes load and run fine, hence no crash) but does not make FML's dev-mode
    // mod-file locator re-scan that directory's bytecode for annotations the way it does the
    // sourceSet(s) actually declared to hold the mod's `main` output. Fixed below by merging
    // testmod's compiled classes directly into main's own classesDirs instead, so FML scans them as
    // part of the mod it already recognizes.
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            vmArg "-Dneoforge.enabledGameTestNamespaces=${mod_id}"
        }
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
            // Two --existing roots: neoforge's own hand-authored assets, plus common's (Phase 1
            // moved most textures/models there). ExistingFileHelper only sees what's listed here -
            // it does not walk the runtimeClasspath's `common` configuration - so without the
            // second root, any item model whose texture lives in common/ (nearly everything) fails
            // datagen with "Texture ... does not exist in any known resource pack".
            programArgs '--mod', mod_id.toString(), '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    '--existing', project(':common').file('src/main/resources/').getAbsolutePath()
        }
        // Headless game test server: boots, registers every @GameTest-annotated method in the
        // testmod source set, runs them, and exits with the number of failed required tests.
        // Run with ./gradlew :neoforge:runGametest
        gametest {
            environment('gameTestServer')
            forgeTemplate('gameTestServer')
            source sourceSets.testmod
            runDir 'build/gametest'
        }
    }
}

file('build/gametest').mkdirs()
