plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    // All three, per the canonical architectury layout (apt-ores@1.21.1, fishtastic). common's
    // classes MUST be on runtimeClasspath - `loom.mods` contributes nothing to the run classpath,
    // and NeoForge's userdev locator only treats a classpath entry as part of the `potionsplus`
    // mod if it carries META-INF/neoforge.mods.toml, which common's output dir does not. Phase 1
    // dropped these two to silence a JPMS split-package ResolutionException; the real cause of
    // that is the 14 packages common and neoforge both occupy (see docs/multi-loader-expansion.md
    // Phase 1). Fix the packages, not the classpath.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

sourceSets {
    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
        // Phase 1 moved the gametests to common/src/testmod; point at them there so
        // :neoforge:runGametest isn't silently NO-SOURCE. (Same shape as fishtastic.)
        java.srcDir project(':common').file('src/testmod/java')
    }
}


repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // compile against the JEI API but do not include it at runtime
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // at runtime, use the full JEI jar for NeoForge
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Testmod: access the compiled main classes.
    testmodImplementation sourceSets.main.output

    // Unit tests. NOTE: architectury-loom has no equivalent of moddev's `unitTest { enable() }`.
    // `AlchemyTestBase`'s `Bootstrap.bootStrap()` is expected to go red here and stay red until
    // Phase 12 restores a working `common/src/test` setup - see docs/multi-loader-expansion.md
    // Phase 0's "known casualty" note. Do not delete the tests to make the build green.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version

    from project(":common").sourceSets.main.resources

    filesMatching('META-INF/neoforge.mods.toml') {
        expand([
            'version': project.version,
            'mod_version': rootProject.mod_version,
            'mod_license': rootProject.mod_license,
            'mod_id': rootProject.mod_id,
            'mod_name': rootProject.mod_name,
            'mod_authors': rootProject.mod_authors,
            'mod_description': rootProject.mod_description,
            'mod_icon': rootProject.mod_icon,
            'neoforge_version': rootProject.neoforge_version,
            'neo_version_range': rootProject.neo_version_range,
            'neoforge_loader_version_range': rootProject.neoforge_loader_version_range,
            'minecraft_version_range': rootProject.minecraft_version_range
        ])
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

loom {
    // TODO(Phase 12): associating testmod here puts its split dirs on every run's classpath, not
    // just gametest's (docs/multi-loader-expansion.md Phase 12's `loom.mods` gotcha). Kept for now
    // to match Phase 0's "change only the build system" scope; revisit with the
    // compileTestmodJava-redirect fix when Phase 12 lands.
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.testmod
        }
    }

    runs {
        configureEach {
            vmArg "-Dneoforge.enabledGameTestNamespaces=${mod_id}"
        }
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
            programArgs '--mod', mod_id.toString(), '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        // Headless game test server: boots, registers every @GameTest-annotated method in the
        // testmod source set, runs them, and exits with the number of failed required tests.
        // Run with ./gradlew :neoforge:runGametest
        gametest {
            environment('gameTestServer')
            forgeTemplate('gameTestServer')
            source sourceSets.testmod
            runDir 'build/gametest'
        }
    }
}

file('build/gametest').mkdirs()
