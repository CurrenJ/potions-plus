plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    // The game test run resolves sourceSets.testmod's runtimeClasspath, which is derived from main's.
    // Without this, common/ is on the compile and dev classpaths but not the run's, and the mod's
    // classloader fails with NoClassDefFoundError on the first common class it touches.
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    modLocalRuntime {
        canBeResolved = true
        canBeConsumed = false
    }
    modLocalRuntime.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

sourceSets {
    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
        // Platform-agnostic game test logic lives in common/ so a future Fabric module can share it.
        java.srcDir(project(':common').file('src/testmod/java'))
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    compileOnly "mezz.jei:jei-1.21.5-neoforge:$rootProject.jei_version"

    // Game tests need the compiled main classes, not just the compile classpath.
    testmodImplementation sourceSets.main.output
}

processResources {
    inputs.property 'version', project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from project(":common").sourceSets.main.resources

    filesMatching('META-INF/neoforge.mods.toml') {
        expand([
            'version': project.version,
            'mod_license': rootProject.mod_license,
            'mod_id': rootProject.mod_id,
            'mod_name': rootProject.mod_name,
            'mod_authors': rootProject.mod_authors,
            'mod_description': rootProject.mod_description,
            'mod_icon': rootProject.mod_icon,
            'mod_neoforge_version_range': "[${rootProject.neoforge_version},)",
            'mod_minecraft_version_range': "[${rootProject.minecraft_version},)"
        ])
    }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

// shadowJar (the distributable mod jar bundling common) isn't wired into
// build/assemble by default, so `./gradlew build` was silently producing only
// the classes-only "raw" jar - anything installed from that (or from a stale
// standalone shadowJar run) would run outdated common/ code with no warning.
tasks.named('assemble') {
    dependsOn(tasks.named('shadowJar'))
}

sourceSets.main.resources.srcDir('src/generated/resources')

loom {
    // Without this, Loom only associates sourceSets.main with the mod's class roots, so FML's
    // per-mod classloader never sees testmod's classes and the @EventBusSubscriber that registers
    // the game tests silently never fires - even though it is on the JVM classpath.
    mods {
        potionsplus {
            sourceSet sourceSets.main
            sourceSet sourceSets.testmod
        }
    }

    runs {
        data {
            clientData()

            programArgs '--flat', '--all',
                    '--mod', 'potionsplus',
                    '--existing', file("src/main/resources").absolutePath,
                    '--output', file("src/generated/resources").absolutePath
        }

        // Headless game test server: runs every registered test, then exits with the number of
        // failed *required* tests. Run with ./gradlew :neoforge:runGametest
        // Structures come from src/generated/resources - regenerate with :neoforge:runData.
        gametest {
            environment "gameTestServer"
            forgeTemplate "gameTestServer"
            source sourceSets.testmod
            name "Game Test Server"
            vmArg "-Dneoforge.enabledGameTestNamespaces=potionsplus"
            runDir "build/gametest"
        }
    }
}

// Custom run dirs are not created automatically before the run task executes, unlike the default
// "run" dir, so a fresh checkout would fail its first runGametest with "working directory does not exist".
file("build/gametest").mkdirs()
