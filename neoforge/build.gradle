plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    modLocalRuntime {
        canBeResolved = true
        canBeConsumed = false
    }
    modLocalRuntime.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    compileOnly "mezz.jei:jei-1.21.5-neoforge:$rootProject.jei_version"

    implementation "com.github.glitchfiend:TerraBlender-neoforge:$rootProject.minecraft_version-$rootProject.terrablender_version"
}

processResources {
    inputs.property 'version', project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from project(":common").sourceSets.main.resources

    filesMatching('META-INF/neoforge.mods.toml') {
        expand([
            'version': project.version,
            'mod_license': rootProject.mod_license,
            'mod_id': rootProject.mod_id,
            'mod_name': rootProject.mod_name,
            'mod_authors': rootProject.mod_authors,
            'mod_description': rootProject.mod_description,
            'mod_icon': rootProject.mod_icon,
            'mod_neoforge_version_range': "[${rootProject.neoforge_version},)",
            'mod_minecraft_version_range': "[${rootProject.minecraft_version},)"
        ])
    }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

// shadowJar (the distributable mod jar bundling common) isn't wired into
// build/assemble by default, so `./gradlew build` was silently producing only
// the classes-only "raw" jar - anything installed from that (or from a stale
// standalone shadowJar run) would run outdated common/ code with no warning.
tasks.named('assemble') {
    dependsOn(tasks.named('shadowJar'))
}

sourceSets.main.resources.srcDir('src/generated/resources')

loom {
    runs {
        data {
            clientData()

            programArgs.addAll '--flat', '--all',
                    '--mod', 'potionsplus',
                    '--existing', file("src/main/resources").absolutePath,
                    '--output', file("src/generated/resources").absolutePath
        }
    }
}
