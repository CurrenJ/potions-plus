# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod properties
mod_version = 1.6.0
mod_description = More potions. Better brewing. Most fun.
mod_id = potionsplus
mod_name = Potions Plus
mod_authors = grill24
mod_license = MIT
mod_icon = potionsplus.png
mod_neoforge_version_range = [${neoforge_version},)
mod_forge_version_range = [${forge_version},)
mod_minecraft_version_range = [${minecraft_version},)
mod_fabric_minecraft_version = ~${minecraft_version}
maven_group = grill24.potionsplus
archives_name = potionsplus
enabled_platforms = neoforge,fabric,forge

# Minecraft properties
minecraft_version = 1.21.1
minecraft_version_range = [1.21,1.21.1)

# Dependencies
fabric_loader_version = 0.17.2
fabric_api_version = 0.116.7+1.21.1
neoforge_version = 21.1.209
neo_version_range = [21,)
neoforge_loader_version_range = [4,)
forge_version = 52.1.2

# Mod compat — JEI. 19.18.10.218 ships a MinecraftForge artifact for 1.21.1 (verify at Phase 11).
# JEI:         https://maven.blamejared.com/mezz/jei/
jei_version = 19.18.10.218
