architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/potionsplus.accesswidener")
}

dependencies {
    // Fabric Loader provides Fabric @Environment annotations.
    // Architectury remaps these to the correct annotations on each platform.
    // Do NOT use any other Fabric Loader classes in common code.
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury injectables provides @ExpectPlatform annotations only.
    implementation "dev.architectury:architectury-injectables:1.0.13"
}

repositories {
    mavenCentral()
}

dependencies {
    // Unit tests. Minecraft itself is on the test classpath via Loom, so tests that need
    // registries (potions, mob effects) bootstrap it themselves - see AlchemyTestBase.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}
