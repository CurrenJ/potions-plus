modLoader = "javafml"
loaderVersion = "[52,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''
logoFile = "${mod_icon}"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${mod_forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${mod_minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# The common mixin config, copied in from common's resources. potionsplus.forge.mixins.json (if any)
# is added in Phase 9, which also re-verifies production mixin-config discovery on Forge 52.x.
[[mixins]]
config = "${mod_id}.mixins.json"
